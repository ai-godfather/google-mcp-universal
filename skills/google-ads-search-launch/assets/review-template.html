const DEFAULT_COMBOS=[{label:'Combination 1',hint:'Brand, price, purchase',h:[0,1,2],d:[0,1]},{label:'Combination 2',hint:'Offer, packs, delivery',h:[3,4,5],d:[2,3]},{label:'Combination 3',hint:'Direct call to action',h:[6,7,8],d:[1,2]}];
const TABS=['preview','fields','keywords','assets','packs','trends','research','archive','history','review'];
const LIMITS={headlines:30,descriptions:90,callouts:25,path1:15,path2:15};
let ORIGINAL=null,DATA=null,L=DEFAULT_LABELS,STORAGE='';
const state={id:null,tab:'preview',device:'desktop',hi:[0,1,2],di:[0,1],showImage:true,showCallouts:true,showLinks:true};
const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const fill=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WIDE=/[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/;
const adLen=t=>Array.from(String(t??'')).reduce((n,c)=>n+(WIDE.test(c)?2:1),0); // conservative; Google Ads validation governs
const num=v=>v==null||v===''||Number.isNaN(Number(v))?L.noData:new Intl.NumberFormat(DATA.locale||undefined,{maximumFractionDigits:2}).format(Number(v));
const money=(v,c)=>v==null||v===''?L.noData:num(v)+(c?' '+c:'');
const acct=v=>money(v,DATA.account&&DATA.account.currency);
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const okURL=u=>typeof u==='string'&&u!==''&&!u.startsWith('//')&&(/^https?:\/\//i.test(u)||!/^[a-z][a-z0-9+.-]*:/i.test(u));
const safeURL=u=>okURL(u)?u:'#';
const safeSrc=u=>okURL(u)||/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(String(u||''))?u:'';
const link=(url,label)=>`<a href="${esc(safeURL(url))}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`;
const hostOf=u=>{try{return new URL(u).hostname}catch(e){return String(u||'')}};
const prod=()=>DATA.products.find(p=>p.id===state.id)||DATA.products[0];
const orig=id=>ORIGINAL.products.find(p=>p.id===id);
const pendingBox=()=>`<div class="empty">${esc(L.pending)}</div>`;
const emptyBox=note=>`<div class="empty">${esc(L.emptyResult)}${note?'<br>'+esc(note):''}</div>`;
const asItem=x=>typeof x==='string'?{text:x,meaning:''}:{text:String((x&&x.text)??''),meaning:String((x&&x.meaning)??'')};
function normalize(d){for(const p of d.products){for(const k of ['headlines','descriptions','callouts'])p[k]=(p[k]||[]).map(asItem);for(const k of ['path1','path2'])p[k]=asItem(p[k]);for(const k of ['keywords','sitelinks','negatives'])p[k]=p[k]||[];p.sitelinks=p.sitelinks.map(s=>Object.assign({},s,{final_url:(s.final_urls&&s.final_urls[0])||s.final_url||''}));p.status=p.status||'pending';p.review=p.review||'unreviewed';p.note=p.note||''}return d}
function restore(){
 let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){}
 const sp=saved.products||{};
 for(const p of DATA.products){const s=sp[p.id];if(!s)continue;for(const k of ['headlines','descriptions','callouts','path1','path2'])if(s[k])p[k]=s[k];p.review=s.review||'unreviewed';p.note=s.note||''}
 // Refresh only unchanged former defaults; every owner edit and note is kept.
 for(const p of DATA.products){const base=orig(p.id);for(const u of p.defaultCopyUpdates||[]){const list=Array.isArray(p[u.field]);const cur=list?p[u.field][u.index]:p[u.field];const src=list?base[u.field][u.index]:base[u.field];if(cur&&src&&cur.text===u.oldText){if(list)p[u.field][u.index]=clone(src);else p[u.field]=clone(src)}}}
 // Append newly added default callouts without replacing saved edits.
 for(const p of DATA.products){const base=orig(p.id);if(p.callouts.length<base.callouts.length)p.callouts.push(...clone(base.callouts.slice(p.callouts.length)))}
}
function persist(){const products={};for(const p of DATA.products){products[p.id]={};for(const k of ['headlines','descriptions','callouts','path1','path2','review','note'])products[p.id][k]=p[k]}try{localStorage.setItem(STORAGE,JSON.stringify({version:DATA.version,products,updatedAt:new Date().toISOString()}))}catch(e){toast(L.storageUnavailable)}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function invalid(key,text){return adLen(text)>LIMITS[key]||(!String(text).trim()&&key!=='path1'&&key!=='path2')}
function invalidCount(p){let n=0;for(const k of ['headlines','descriptions','callouts'])n+=p[k].filter(x=>invalid(k,x.text)).length;for(const k of ['headlines','descriptions']){const seen=new Set();for(const x of p[k]){const t=x.text.trim().toLowerCase();if(t&&seen.has(t))n++;seen.add(t)}}n+=['path1','path2'].filter(k=>invalid(k,p[k].text)).length;if(p.path2.text.trim()&&!p.path1.text.trim())n++;if(p.headlines.length!==15)n++;if(p.descriptions.length!==4)n++;return n}
function limitText(p){const n=invalidCount(p);return n?fill(L.limitsBad,{n}):L.limitsOk}
function hasEdits(p){const o=orig(p.id);return ['headlines','descriptions','callouts','path1','path2'].some(k=>JSON.stringify(p[k])!==JSON.stringify(o[k]))}
function goal(p){const g=p.conversionGoal||DATA.conversionGoal;return g?[g.name,(g.actionIds||[]).join(', '),g.status].filter(Boolean).join(' · '):L.noData}
function statusBadge(p){return p.status==='ready'?badge(L.statusReady,'blue'):p.status==='held'?badge(L.statusHeld,'hold'):badge(L.statusPending,'hold')}
function decisionBadge(d){const v=String(d||'').toLowerCase();return d?badge(d,v==='include'||v==='test'?'good':v==='exclude'||v==='hold'?'hold':''):''}
function sourceBadge(k){const s=String(k.source||'').toLowerCase();return k.source?badge(k.source,s.startsWith('history')?'good':s.startsWith('hypothesis')?'hold':'blue'):''}
function readyBudget(){const b=new Map();for(const x of DATA.products)if(x.status==='ready'&&!b.has(x.campaign))b.set(x.campaign,Number(x.campaignBudget)||0);return b}
function selectProduct(id){if(state.tab==='overview')state.tab='preview';state.id=id;state.hi=[0,1,2];state.di=[0,1];render();window.scrollTo(0,0)}

 $('app-title').textContent=DATA.title||L.appTitle;$('app-sub').textContent=fill(L.appSub,{date:DATA.generatedAt?String(DATA.generatedAt).slice(0,10):''});

 const pill=$('status-pill');if(DATA.statusPill&&DATA.statusPill.text){pill.textContent=DATA.statusPill.text;if(DATA.statusPill.url)pill.href=safeURL(DATA.statusPill.url);else pill.removeAttribute('href');pill.classList.remove('hidden')}
 const b=DATA.banner;$('banner').innerHTML=b&&b.text?`<div class="notice ${b.kind==='hold'?'hold':''}"><strong>${esc(b.title||'')}</strong> ${esc(b.text)}${b.url?' '+link(b.url,b.linkText||b.url):''}</div>`:'';
}
function render(){
 const p=prod();document.title=p.name+' '+p.country+' · '+(DATA.title||L.appTitle);
 const budgets=readyBudget(),held=DATA.products.filter(x=>x.status!=='ready');
 $('pilot-total').textContent=acct([...budgets.values()].reduce((a,b)=>a+b,0))+L.perDay;
 $('pilot-scope').textContent=fill(L.scopeLine,{ready:DATA.products.length-held.length,campaigns:budgets.size})+(held.length?fill(L.outsideLine,{list:held.map(x=>x.name+' '+x.country).join(', ')}):'');
 $('product-list').innerHTML=DATA.products.map(x=>{const dot=x.status!=='ready'?'hold':x.review==='accepted'?'ok':'';const title=x.status!=='ready'?L.statusHeld:x.review==='accepted'?L.accepted:L.unreviewed;return `<button class="product-choice ${x.id===p.id?'selected':''}" data-product="${esc(x.id)}" aria-pressed="${x.id===p.id}"><div><b>${esc(x.name)}</b><small>${esc(x.countryName||x.country)} · ${esc(money(x.price,x.currency))}</small></div><span class="dot ${dot}" title="${esc(title)}"></span></button>`}).join('');
 const img=safeSrc(p.image);
 $('heading').innerHTML=`${img?`<img class="product-photo" src="${esc(img)}" alt="${esc(p.name)}">`:''}<div><h1>${esc(p.name)} <span class="muted-light">/ ${esc(p.country)}</span></h1><div class="trail">${esc(p.shop)} · ${esc(p.languageName||p.lang)}</div><div class="badges">${statusBadge(p)}${badge(L.plannedPaused)}${badge(L.copyCount)}</div></div><div class="heading-end"><div class="price-big">${esc(money(p.price,p.currency))}</div><div class="sub">${esc(L.productPrice)}</div><div style="margin-top:8px">${p.status==='ready'?badge(acct(p.campaignBudget)+L.perDay):badge(L.outsideTest,'hold')}</div></div>`;
 $('notice').innerHTML=p.status==='ready'?`<div class="notice"><strong>${esc(L.readyNotice)}</strong> ${esc(p.reason||'')}</div>`:`<div class="notice hold"><strong>${esc(L.heldNotice)}</strong> ${esc(p.reason||'')}</div>`;
 $('tabs').innerHTML=TABS.map(k=>`<button data-tab="${k}" class="${k===state.tab?'active':''}" aria-current="${k===state.tab?'page':'false'}">${esc(L.tabs[k])}</button>`).join('');

}
function preview(p){
 const blank={text:'',meaning:''},hs=state.hi.map(i=>p.headlines[i]||p.headlines[0]||blank),ds=state.di.map(i=>p.descriptions[i]||p.descriptions[0]||blank);
 const combos=p.combos||DATA.combos||DEFAULT_COMBOS;
 const sel=(kind,arr,i,v)=>`<div><label for="${kind}${i}">${esc(kind==='h'?L.headline:L.description)} ${i+1}</label><select id="${kind}${i}" data-select="${kind}${i}">${arr.map((x,j)=>`<option value="${j}" ${v===j?'selected':''}>${j+1}. ${esc(x.text)}</option>`).join('')}</select></div>`;
 const controls=`<aside class="controls"><h3>${esc(L.comboTitle)}</h3><div class="combos">${combos.map((c,i)=>`<button data-combo="${i}"><b>${esc(c.label)}</b>${esc(c.hint||'')}</button>`).join('')}</div>${state.hi.map((v,i)=>sel('h',p.headlines,i,v)).join('')}${state.di.map((v,i)=>sel('d',p.descriptions,i,v)).join('')}${['showImage','showCallouts','showLinks'].map(k=>`<label class="check"><input type="checkbox" data-show="${k}" ${state[k]?'checked':''}> ${esc(L[k])}</label>`).join('')}<p class="small">${esc(L.comboNote)}</p></aside>`;
 const img=safeSrc(p.image),logo=safeSrc(p.logoUrl),promo=p.promotion||{};

 const prices=offers.length?`<div class="ad-prices">${offers.map(z=>`<a href="${esc(safeURL(z.final_url))}" target="_blank" rel="noopener noreferrer"><strong>${esc(z.header)}</strong><b>${esc(money(z.price,z.currency||p.prices.currency||p.currency))}</b><small>${esc(z.description)}</small></a>`).join('')}</div>`:'';
 const links=state.showLinks?`${promoLine}${prices}<div class="ad-links">${p.sitelinks.map(s=>`<div>${link(s.final_url,s.link_text)}<small>${esc(s.description1)}<br>${esc(s.description2)}</small></div>`).join('')}</div>`:'';

 return `<h2>${esc(L.previewTitle)}</h2><p class="intro">${esc(L.previewIntro)}</p><div class="preview-grid"><div><div class="stage"><div class="stage-top"><span>${esc(fill(L.simulation,{country:p.countryName||p.country}))}</span><div class="segmented"><button data-device="desktop" class="${state.device==='desktop'?'on':''}">${esc(L.desktop)}</button><button data-device="mobile" class="${state.device==='mobile'?'on':''}">${esc(L.mobile)}</button></div></div>${p.status!=='ready'?`<div class="hold-watermark">${esc(L.heldWatermark)}</div>`:''}<div class="searchbar"><span class="search-icon"></span>${esc((p.keywords[0]&&p.keywords[0].text)||p.name)}<span class="clear-x">×</span></div><article lang="${esc(p.lang||'')}" class="serp ${state.device==='mobile'?'mobile':''}"><div class="sponsor">${esc(p.sponsoredLabel||L.sponsored)}</div><div class="url-line"><div class="favicon" aria-hidden="true">${favicon}</div><div><div class="domain">${esc(p.businessName||p.shop)}</div><div class="path">https://${esc(p.shop)} › ${esc(p.path1.text)}${p.path2.text?' › '+esc(p.path2.text):''}</div></div></div><a class="ad-title" href="${esc(safeURL(p.url))}" target="_blank" rel="noopener noreferrer">${hs.map(h=>esc(h.text)).join(' | ')}</a><div class="ad-content">${state.showImage&&img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:''}<p>${ds.map(d=>esc(d.text)).join(' ')}</p></div>${state.showCallouts?`<div class="ad-callouts">${p.callouts.map(c=>esc(c.text)).join(' · ')}</div>`:''}${links}</article><div class="preview-note">${esc(L.previewNote)}</div></div>${meaning}<div class="campaign-line">${esc(L.finalUrl)}: ${link(p.url)}</div></div>${controls}</div><div class="row-actions"><button class="primary" data-tab="fields">${esc(L.reviewAllFields)}</button><button data-tab="review">${esc(L.addReview)}</button><button data-act="copy-payload">${esc(L.copyPayload)}</button></div>`;

 const neg=p.negatives.length?`<ul>${p.negatives.map(n=>`<li>${esc(kw(n))}${n.reason?' · '+esc(n.reason):''}</li>`).join('')}</ul>`:`<p>${esc(L.negativesNone)}</p>`;

function trendChart(r){
 const a=r.points||[];if(!a.some(x=>x.value!=null))return emptyBox();
 const w=600,h=130,runs=[];let run=[];a.forEach((v,i)=>{if(v.value==null){if(run.length)runs.push(run);run=[]}else run.push([25+i*(w-40)/Math.max(1,a.length-1),h-10-Number(v.value)*(h-25)/100,v])});if(run.length)runs.push(run);
 const last=a[a.length-1]||{};
 return `<svg class="trend-line" viewBox="0 0 600 155" role="img" aria-label="${esc(L.trendsKey)}"><line x1="25" x2="590" y1="120" y2="120" stroke="#ccd6e5"/><text x="3" y="18">100</text><text x="10" y="121">0</text>${runs.map(arr=>`<polyline fill="none" stroke="#2865c7" stroke-width="2" points="${arr.map(x=>x[0].toFixed(1)+','+x[1].toFixed(1)).join(' ')}"/>${arr.map(x=>`<circle cx="${x[0].toFixed(1)}" cy="${x[1].toFixed(1)}" r="3" fill="#2865c7"><title>${esc(x[2].from)}: ${esc(x[2].value)}</title></circle>`).join('')}`).join('')}<text x="25" y="146">${esc(a[0]&&a[0].from)}</text><text x="490" y="146">${esc(last.to||last.from)}</text></svg>`;
}

 const vol=(t.volumes||[]).length?`<h3>${esc(L.volumesTitle)}</h3><div class="tablewrap section"><table><thead><tr><th>${esc(L.query)}</th><th>${esc(L.kwVolume)}</th><th>${esc(L.kwCpc)}</th></tr></thead><tbody>${t.volumes.map(v=>`<tr><td>${esc(v.query)}</td><td>${esc(num(v.volume))}</td><td>${esc(v.providerCpc!=null?money(v.providerCpc,v.providerCurrency):L.noData)}</td></tr>`).join('')}</tbody></table></div>`:'';
 const cand=(t.candidates||[]).length?`<h3>${esc(L.candidatesTitle)}</h3><div class="tablewrap"><table><thead><tr><th>${esc(L.query)}</th><th>${esc(L.kwSource)}</th><th>${esc(L.kwDecision)}</th><th>${esc(L.kwReason)}</th></tr></thead><tbody>${t.candidates.map(k=>`<tr><td>${esc(k.query)}</td><td>${esc(k.source||'')}</td><td>${decisionBadge(k.decision)}</td><td>${esc(k.reason||'')}</td></tr>`).join('')}</tbody></table></div>`:'';
 const errs=(t.errors||[]).length?`<div class="notice hold section">${t.errors.map(e=>esc(e)).join('<br>')}</div>`:'';
 return `<h2>${esc(L.trendsTitle)}</h2><p class="intro">${esc(L.trendsIntro)}${series.length&&t.note?' '+esc(t.note):''}</p>${charts}${vol}${cand}${errs}`;

function bars(d){const a=(d&&d.monthly)||[];if(!a.length)return `<div class="empty">${esc(L.noData)}</div>`;const max=Math.max(1,...a.map(x=>Number(x.volume)||0));return `<div class="graph">${a.map(x=>`<div class="bar-col" title="${esc(x.year+'-'+x.month)}: ${esc(x.volume)}"><span>${esc(num(x.volume))}</span><div class="bar" style="height:${Math.max(1,(Number(x.volume)||0)/max*104)}px"></div><label>${esc(String(x.month).padStart(2,'0')+'/'+String(x.year).slice(2))}</label></div>`).join('')}</div>`}

}
function exportAll(){const a=DATA.account||{};const out={artifact_version:DATA.version,exported_at:new Date().toISOString(),customer_id:a.customerId,currency:a.currency,google_ads_mutations_by_this_page:0,activation_authorized:false,scope:DATA.scopeNote||'',products:DATA.products.map(payload)};$('export-json').value=JSON.stringify(out,null,2);$('export-modal').showModal()}
function downloadExport(){const blob=new Blob([$('export-json').value],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='search-launch-review-'+String(DATA.version||'export').replace(/[^A-Za-z0-9._-]+/g,'-')+'-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast(L.downloadHint)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast(L.copied)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(L.copied)}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!DATA)return;
 if(b.dataset.product){selectProduct(b.dataset.product);return}
 if(b.dataset.tab){state.tab=b.dataset.tab;render();return}
 if(b.dataset.device){state.device=b.dataset.device;render();return}
 if(b.dataset.combo!=null){const p=prod(),c=(p.combos||DATA.combos||DEFAULT_COMBOS)[Number(b.dataset.combo)]||{h:[],d:[]};state.hi=[0,1,2].map(i=>Math.min((c.h||[])[i]??i,Math.max(0,p.headlines.length-1)));state.di=[0,1].map(i=>Math.min((c.d||[])[i]??i,Math.max(0,p.descriptions.length-1)));render();return}
 if(b.dataset.review){prod().review=b.dataset.review;persist();render();toast(L.savedLocal);return}
 switch(b.dataset.act){
  case 'print':window.print();break;case 'export':exportAll();break;case 'download-export':downloadExport();break;
  case 'copy-export':copyText($('export-json').value);break;case 'close-export':$('export-modal').close();break;
  case 'copy-payload':copyText(JSON.stringify(payload(prod()),null,2));break;case 'overview':state.tab='overview';render();break;
  case 'reset-product':{const p=prod(),o=orig(p.id);for(const k of ['headlines','descriptions','callouts','path1','path2'])p[k]=clone(o[k]);persist();render();toast(L.restored);break}
 }
});
document.addEventListener('change',e=>{const el=e.target;if(!DATA)return;if(el.dataset.select){const t=el.dataset.select;if(t[0]==='h')state.hi[Number(t[1])]=Number(el.value);else state.di[Number(t[1])]=Number(el.value);render()}if(el.dataset.show){state[el.dataset.show]=el.checked;render()}});
document.addEventListener('input',e=>{
 const el=e.target;if(!DATA)return;
 if(el.id==='owner-note'){prod().note=el.value;persist();return}
 if(!el.dataset.field)return;
 const p=prod(),key=el.dataset.field,i=el.dataset.index,x=i===''?p[key]:p[key][Number(i)];x.text=el.value;
 const field=el.closest('.field');field.classList.toggle('invalid',invalid(key,el.value));field.querySelector('em').textContent=adLen(el.value)+'/'+LIMITS[key];
 const summary=$('limit-summary');if(summary){summary.textContent=limitText(p);summary.className=invalidCount(p)?'alert-count':'small'}
 persist();
});
const MAIN_HTML=$('main').innerHTML;
function boot(data){
 if(!data||!Array.isArray(data.products)||!data.products.length)throw new Error('a nonempty products array is required');
 ORIGINAL=normalize(clone(data));DATA=clone(ORIGINAL);
 const custom=DATA.labels||{};L=Object.assign({},DEFAULT_LABELS,custom,{tabs:Object.assign({},DEFAULT_LABELS.tabs,custom.tabs||{}),assetLabels:Object.assign({},DEFAULT_LABELS.assetLabels,custom.assetLabels||{})});
 document.documentElement.lang=DATA.uiLang||'en';STORAGE='search-launch-review-'+(DATA.version||'unversioned');
 $('main').innerHTML=MAIN_HTML;$('rail').classList.remove('hidden');
 restore();state.id=DATA.products[0].id;staticLabels();render();
}
function showLoader(message){
 $('rail').classList.add('hidden');
 $('main').innerHTML=`<div class="form-block"><h2>${esc(DEFAULT_LABELS.loaderTitle)}</h2><p class="intro">${esc(DEFAULT_LABELS.loaderText)}</p>${message?`<div class="notice hold">${esc(message)}</div>`:''}<input type="file" id="data-file" accept="application/json,.json"></div>`;
 $('data-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{boot(JSON.parse(await f.text()))}catch(err){DATA=null;showLoader(fill(DEFAULT_LABELS.loaderError,{error:err.message}))}});
}
window.__searchReview={getData:()=>DATA,getState:()=>state,validate:()=>DATA?DATA.products.map(p=>({id:p.id,invalid:invalidCount(p),status:p.status})):[],payload:()=>DATA?payload(prod()):null};
(function start(){
 const raw=$('review-data').textContent.trim();
 if(!raw||raw.startsWith('/*')){showLoader('');return}
 try{boot(JSON.parse(raw))}catch(err){DATA=null;showLoader(fill(DEFAULT_LABELS.loaderError,{error:err.message}))}
})();
</script></body></html>
